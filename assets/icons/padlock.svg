<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <title>Open focus lock</title>
  <!-- idle state at 16 and 32: the brand tile and white padlock, shackle open because no session
       is running. The worker redraws these two sizes per phase and matches this geometry. The tile
       is larger and the padlock heavier than brand.svg, because at 16 px the ring that fills
       brand.svg's margin is not resolvable and the glyph needs the room instead. -->
  <rect x="6" y="6" width="116" height="116" rx="26" fill="#2ebf58" />
  <g transform="translate(64 64) scale(1.42) translate(-64 -64)">
    <path
      d="M 53.5 61 V 53.6 A 10.5 10.5 0 0 1 74.5 53.6 V 61"
      fill="none"
      stroke="#ffffff"
      stroke-width="6.5"
      stroke-linecap="round"
      transform="rotate(-24 74.5 61) translate(0 -6)"
    />
    <rect x="46" y="58.5" width="36" height="29" rx="4.5" fill="#ffffff" />
    <circle cx="64" cy="69.5" r="3.4" fill="#2ebf58" />
    <path d="M 62.5 70.5 H 65.5 L 66.1 79 H 61.9 Z" fill="#2ebf58" />
  </g>
</svg>
