<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <title>Open focus lock</title>
  <!-- The idle toolbar glyph at 16 and 32: a green padlock drawn as large as the canvas allows,
       shackle open because no session is locking sites. The worker redraws these two sizes and
       matches this geometry exactly, so the static PNG and the drawn icon are the same mark. -->
  <path
    d="M 29.6 50.4 A 34.4 34.4 0 0 1 98.4 50.4"
    fill="none"
    stroke="#2ebf58"
    stroke-width="16"
    stroke-linecap="round"
    transform="translate(0 11.2) rotate(30 98.4 50.4)"
  />
  <rect x="12" y="50.4" width="104" height="72" rx="16" fill="#2ebf58" />
  <circle cx="64" cy="80" r="9.2" fill="#116331" />
  <rect x="60.2" y="80" width="7.6" height="21.6" rx="3.8" fill="#116331" />
</svg>
